databaseChangeLog:
  - changeSet:
      id: 001-create-checkout-drafts
      author: kanapa4
      changes:
        - createTable:
            tableName: checkout_drafts
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: data
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
